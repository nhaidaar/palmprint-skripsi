services:
  palmgate-api:
    image: ${PALMGATE_IMAGE:-ghcr.io/nhaidaar/palmprint-be:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/data/palmprint.db
      - APP_DEBUG=${APP_DEBUG:-true}
    expose:
      - "8000"
    volumes:
      - ./model.tflite:/app/model.tflite:ro
      - ./hand_landmarker.task:/app/hand_landmarker.task:ro
      - palmgate-db:/data
      - ./data/captures:/data/captures

  palmgate-frontend:
    image: ${PALMGATE_FRONTEND_IMAGE:-ghcr.io/nhaidaar/palmprint-fe:latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"

  palmgate-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - palmgate-api
      - palmgate-frontend
    environment:
      - PALMGATE_API_UPSTREAM=http://palmgate-api:8000
      - PALMGATE_FRONTEND_UPSTREAM=http://palmgate-frontend:3000
    volumes:
      - ./deploy/nginx/palmgate.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${PALMGATE_HTTP_PORT:-8080}:8080"

volumes:
  palmgate-db:
    driver: local
